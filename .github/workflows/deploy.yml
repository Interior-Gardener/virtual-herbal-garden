# Builds the site and publishes it to GitHub Pages on every push to main.
#
# Pages serves the site from https://<user>.github.io/<repo>/, so the build
# is told that sub-path through VITE_BASE; everything in the bundle resolves
# against it (see vite.config.ts and src/lib/asset.ts).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # So a deploy can be re-run from the Actions tab without a new commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
